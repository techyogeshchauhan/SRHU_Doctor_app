# nginx site for stwneo.epulse.in ONLY (shared server: no other site is
# referenced here). Replaces the existing stwneo.epulse.in file; the
# Certbot lines are the ones already on the server.
#
#   /         Flutter Web/PWA from the deploy repo checkout
#   /api/     STW Neo API on 127.0.0.1:4000 (see stwneo-api.service)
#
# Apply: back up the current file, copy this over it, `nginx -t`, then
# `systemctl reload nginx` (graceful: no site goes offline). See docs/RELEASE.md.

server {
    server_name stwneo.epulse.in;

    root /var/www/neonatal-stw-web;
    index index.html;

    # The web root is a git checkout: never serve its history.
    location ~ /\.git {
        deny all;
    }

    # STW Neo API (Node on 127.0.0.1 only). The trailing slash strips /api.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 2M;
    }

    # App shell: always revalidated, so a deploy is live on the next load.
    location ~ ^/(sw\.js|index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ES modules (pdf.js fallback) need a JavaScript MIME type.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stwneo.epulse.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stwneo.epulse.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = stwneo.epulse.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name stwneo.epulse.in;
    return 404; # managed by Certbot


}
