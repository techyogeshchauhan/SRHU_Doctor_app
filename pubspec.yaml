name: neonatal_stw
description: Bedside decision support for the ICMR/DHR Standard Treatment Workflows on Respiratory Distress in Neonates and Retinopathy of Prematurity.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.19.0
  share_plus: ^10.1.4
  pdfx: ^2.11.0
  path_provider: ^2.1.5
  dio: ^5.8.0
  connectivity_plus: ^7.3.2
  uuid: ^4.6.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_adaptive_foreground.png"

flutter:
  uses-material-design: true
  # Listed file by file so unused source images and duplicate PDFs in the
  # folders are not bundled (smaller Android, iOS and web/PWA downloads).
  assets:
    - assets/images/icmr_logo.png
    - assets/images/logo212.png
    - assets/images/hu.png
    - assets/images/aiims-delhi.jpg
    - assets/images/pgi-logo.jpg
    - assets/images/GMCH chandigrah.png
    - assets/images/sas_chart.png
    - assets/images/sas/
    - assets/pdfs/respiratory_distress_neonates_stw.pdf
    - assets/pdfs/retinopathy_of_prematurity_stw.pdf
    - assets/pdfs/Antenatal_Corticosteroids_for_Preterm_Birth_8th_Oct.pdf
    - assets/pdfs/Neonatal_Hypoglycemia_8th_Oct.pdf
    - assets/stw_index/
    - assets/pages/
    - assets/pages/respiratory_distress_neonates_stw.pdf/
    - assets/pages/retinopathy_of_prematurity_stw.pdf/
    - assets/pages/Antenatal_Corticosteroids_for_Preterm_Birth_8th_Oct.pdf/
    - assets/pages/Neonatal_Hypoglycemia_8th_Oct.pdf/
    - assets/regions/
    - assets/regions/crops/
    - assets/knowledge_graph/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
