<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STW Neo - Curated Region Annotation Tool</title>
  <style>
    :root {
      --navy: #0f172a;
      --blue: #0284c7;
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.28);
      --border: #e2e8f0;
      --sidebar-w: 420px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #1e293b; }
    #sidebar {
      width: var(--sidebar-w);
      background: #ffffff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    }
    .header { padding: 14px 16px; background: #0f172a; color: white; }
    .header h1 { font-size: 15px; font-weight: 700; color: #38bdf8; }
    .header p { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .toolbar {
      padding: 10px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button, input {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    button {
      cursor: pointer;
      font-weight: 600;
      background: #0284c7;
      color: white;
      border: none;
      transition: background 0.15s;
    }
    button:hover { background: #0369a1; }
    button.btn-sec { background: #e2e8f0; color: #334155; }
    button.btn-sec:hover { background: #cbd5e1; }
    button.btn-del { background: #ef4444; color: white; }
    button.btn-del:hover { background: #dc2626; }
    #regionList {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .region-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      background: white;
      transition: all 0.15s;
    }
    .region-card:hover { border-color: var(--blue); box-shadow: 0 2px 6px rgba(2,132,199,0.15); }
    .region-card.active { border-color: var(--amber); background: #fffbeb; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e0f2fe;
      color: #0369a1;
    }
    .badge.algorithm { background: #dcfce7; color: #15803d; }
    .badge.table { background: #fef3c7; color: #b45309; }
    .title { font-size: 13px; font-weight: 600; color: #0f172a; margin-top: 4px; }
    .coords { font-size: 10.5px; color: #64748b; font-family: monospace; margin-top: 4px; }
    #editForm {
      border-top: 1px solid var(--border);
      background: #f8fafc;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 48%;
      overflow-y: auto;
    }
    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-group label { font-size: 11px; font-weight: 600; color: #475569; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: white;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #canvasContainer {
      flex: 1;
      overflow: auto;
      background: #1e293b;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }
    #stage {
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      user-select: none;
    }
    #pageImg { display: block; max-width: none; pointer-events: none; }
    #overlaySvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .box-rect {
      fill: rgba(245, 158, 11, 0.25);
      stroke: #d97706;
      stroke-width: 2;
      cursor: pointer;
      transition: fill 0.15s, stroke-width 0.15s;
    }
    .box-rect:hover { fill: rgba(245, 158, 11, 0.45); stroke: #b45309; stroke-width: 3; }
    .box-rect.selected { fill: rgba(14, 165, 233, 0.35); stroke: #0284c7; stroke-width: 3.5; }
    .drag-rect {
      fill: rgba(2, 132, 199, 0.25);
      stroke: #0284c7;
      stroke-width: 2;
      stroke-dasharray: 4 2;
    }
    .box-label {
      font-size: 12px;
      font-weight: 700;
      fill: #ffffff;
      paint-order: stroke;
      stroke: #0f172a;
      stroke-width: 2.5px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="header">
      <h1>STW Neo Curated Region Annotator</h1>
      <p>Drag on the image to create a region. Export/import regions.json.</p>
    </div>

    <div class="toolbar">
      <select id="docSelect" onchange="loadSelectedDoc()">
        <option value="respiratory_distress_neonates_stw.pdf">Respiratory Distress (Page 1)</option>
        <option value="retinopathy_of_prematurity_stw.pdf">Retinopathy of Prematurity (Page 1)</option>
      </select>
      <button onclick="exportJson()">Export JSON</button>
      <button class="btn-sec" onclick="triggerImport()">Import JSON</button>
      <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importJson(event)">
      <button class="btn-sec" onclick="triggerImageUpload()">Upload WebP</button>
      <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="uploadImage(event)">
    </div>

    <div id="regionList"></div>

    <div id="editForm">
      <div class="card-top">
        <strong style="font-size: 12px; color: #0f172a;">Edit Region Properties</strong>
        <span id="coordDisplay" style="font-size: 10px; color: #64748b; font-family: monospace;"></span>
      </div>

      <div class="form-group">
        <label>ID (Slug)</label>
        <input type="text" id="fId" placeholder="e.g. rd_initial_preterm_cpap_caffeine">
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" id="fTitle" placeholder="Human readable clinical section title">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Type</label>
          <select id="fType">
            <option value="algorithm">algorithm</option>
            <option value="table">table</option>
            <option value="text">text</option>
          </select>
        </div>
        <div class="form-group">
          <label>Section</label>
          <input type="text" id="fSection" placeholder="e.g. Initial Support">
        </div>
      </div>

      <div class="form-group">
        <label>Aliases (comma separated)</label>
        <input type="text" id="fAliases" placeholder="cpap, caffeine, preterm, 5-6 cm h2o">
      </div>

      <div class="form-group">
        <label>Example Questions (English & Hinglish, one per line)</label>
        <textarea id="fQuestions" rows="2" placeholder="Caffeine dose in preterm&#10;Preterm baby ko CPAP kab shuru karein?"></textarea>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 4px;">
        <button style="flex:1" onclick="saveActiveForm()">Save Changes</button>
        <button class="btn-del" onclick="deleteActiveRegion()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Stage Container -->
  <div id="canvasContainer">
    <div id="stage">
      <img id="pageImg" alt="PDF Page">
      <svg id="overlaySvg"></svg>
    </div>
  </div>

  <script>
    let allRegions = [];
    let activeRegion = null;
    let isDrawing = false;
    let startX = 0, startY = 0;
    let currentDoc = "respiratory_distress_neonates_stw.pdf";
    let currentPage = 1;

    const docSelect = document.getElementById("docSelect");
    const pageImg = document.getElementById("pageImg");
    const overlaySvg = document.getElementById("overlaySvg");
    const stage = document.getElementById("stage");
    const regionList = document.getElementById("regionList");

    async function init() {
      setupSvgEvents();
      // Try to fetch regions.json from assets
      try {
        const resp = await fetch("../assets/regions/regions.json");
        if (resp.ok) {
          allRegions = await resp.json();
        }
      } catch (e) {
        console.log("No existing regions.json found yet, starting fresh.");
      }
      loadSelectedDoc();
    }

    function loadSelectedDoc() {
      currentDoc = docSelect.value;
      currentPage = 1;
      const imgPath = `../assets/pages/${currentDoc}/${currentPage}.webp`;
      pageImg.src = imgPath;
      pageImg.onload = () => {
        renderRegions();
      };
      pageImg.onerror = () => {
        alert(`Could not load ${imgPath}. Please click 'Upload WebP' to select the page image.`);
      };
    }

    function triggerImageUpload() {
      document.getElementById("imgInput").click();
    }

    function uploadImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      pageImg.src = url;
      pageImg.onload = () => renderRegions();
    }

    function setupSvgEvents() {
      overlaySvg.addEventListener("mousedown", (e) => {
        if (e.target.tagName === "rect" && !e.target.classList.contains("drag-rect")) return;
        const pt = getSvgPoint(e);
        isDrawing = true;
        startX = pt.x;
        startY = pt.y;

        let dragRect = document.getElementById("dragRect");
        if (!dragRect) {
          dragRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          dragRect.id = "dragRect";
          dragRect.setAttribute("class", "drag-rect");
          overlaySvg.appendChild(dragRect);
        }
        updateRect(dragRect, startX, startY, 0, 0);
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDrawing) return;
        const pt = getSvgPoint(e);
        const dragRect = document.getElementById("dragRect");
        if (dragRect) {
          const x = Math.min(startX, pt.x);
          const y = Math.min(startY, pt.y);
          const w = Math.abs(pt.x - startX);
          const h = Math.abs(pt.y - startY);
          updateRect(dragRect, x, y, w, h);
        }
      });

      window.addEventListener("mouseup", (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        const dragRect = document.getElementById("dragRect");
        if (!dragRect) return;

        const pt = getSvgPoint(e);
        const x = Math.min(startX, pt.x);
        const y = Math.min(startY, pt.y);
        const w = Math.abs(pt.x - startX);
        const h = Math.abs(pt.y - startY);
        dragRect.remove();

        if (w > 10 && h > 10) {
          const imgW = pageImg.naturalWidth || pageImg.width;
          const imgH = pageImg.naturalHeight || pageImg.height;

          const normX = parseFloat((x / imgW).toFixed(5));
          const normY = parseFloat((y / imgH).toFixed(5));
          const normW = parseFloat((w / imgW).toFixed(5));
          const normH = parseFloat((h / imgH).toFixed(5));

          const newRegion = {
            id: `region_${Date.now()}`,
            document: currentDoc,
            page: currentPage,
            title: "New Annotated Region",
            type: "algorithm",
            section: "Clinical Protocol",
            x: normX,
            y: normY,
            w: normW,
            h: normH,
            aliases: [],
            example_questions: [],
            text: ""
          };

          allRegions.push(newRegion);
          selectRegion(newRegion);
          renderRegions();
        }
      });
    }

    function getSvgPoint(e) {
      const rect = stage.getBoundingClientRect();
      const scaleX = (pageImg.naturalWidth || pageImg.width) / rect.width;
      const scaleY = (pageImg.naturalHeight || pageImg.height) / rect.height;
      return {
        x: Math.max(0, Math.min((e.clientX - rect.left) * scaleX, (pageImg.naturalWidth || pageImg.width))),
        y: Math.max(0, Math.min((e.clientY - rect.top) * scaleY, (pageImg.naturalHeight || pageImg.height)))
      };
    }

    function updateRect(el, x, y, w, h) {
      el.setAttribute("x", x);
      el.setAttribute("y", y);
      el.setAttribute("width", w);
      el.setAttribute("height", h);
    }

    function renderRegions() {
      const imgW = pageImg.naturalWidth || pageImg.width;
      const imgH = pageImg.naturalHeight || pageImg.height;
      overlaySvg.setAttribute("viewBox", `0 0 ${imgW} ${imgH}`);
      overlaySvg.innerHTML = "";
      regionList.innerHTML = "";

      const currentDocRegions = allRegions.filter(r => r.document === currentDoc && r.page === currentPage);

      currentDocRegions.forEach((r, idx) => {
        const rx = r.x * imgW;
        const ry = r.y * imgH;
        const rw = r.w * imgW;
        const rh = r.h * imgH;

        // SVG rect
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("class", `box-rect ${activeRegion && activeRegion.id === r.id ? 'selected' : ''}`);
        updateRect(rect, rx, ry, rw, rh);
        rect.onclick = (e) => {
          e.stopPropagation();
          selectRegion(r);
        };
        overlaySvg.appendChild(rect);

        // Label
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("class", "box-label");
        text.setAttribute("x", rx + 6);
        text.setAttribute("y", Math.max(ry + 16, 18));
        text.textContent = `${idx + 1}. ${r.title || r.id}`;
        overlaySvg.appendChild(text);

        // Sidebar card
        const card = document.createElement("div");
        card.className = `region-card ${activeRegion && activeRegion.id === r.id ? 'active' : ''}`;
        card.innerHTML = `
          <div class="card-top">
            <span class="badge ${r.type}">${r.type}</span>
            <span style="font-size:11px; color:#64748b;">#${idx + 1}</span>
          </div>
          <div class="title">${r.title || 'Untitled'}</div>
          <div class="coords">[${r.x}, ${r.y}, ${r.w}, ${r.h}]</div>
        `;
        card.onclick = () => selectRegion(r);
        regionList.appendChild(card);
      });
    }

    function selectRegion(r) {
      activeRegion = r;
      document.getElementById("fId").value = r.id || "";
      document.getElementById("fTitle").value = r.title || "";
      document.getElementById("fType").value = r.type || "algorithm";
      document.getElementById("fSection").value = r.section || "";
      document.getElementById("fAliases").value = (r.aliases || []).join(", ");
      document.getElementById("fQuestions").value = (r.example_questions || []).join("\n");
      document.getElementById("coordDisplay").textContent = `x:${r.x} y:${r.y} w:${r.w} h:${r.h}`;
      renderRegions();
    }

    function saveActiveForm() {
      if (!activeRegion) return;
      activeRegion.id = document.getElementById("fId").value.trim();
      activeRegion.title = document.getElementById("fTitle").value.trim();
      activeRegion.type = document.getElementById("fType").value;
      activeRegion.section = document.getElementById("fSection").value.trim();
      activeRegion.aliases = document.getElementById("fAliases").value.split(",").map(s => s.trim()).filter(Boolean);
      activeRegion.example_questions = document.getElementById("fQuestions").value.split("\n").map(s => s.trim()).filter(Boolean);
      renderRegions();
    }

    function deleteActiveRegion() {
      if (!activeRegion) return;
      allRegions = allRegions.filter(r => r.id !== activeRegion.id);
      activeRegion = null;
      renderRegions();
    }

    function exportJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allRegions, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "regions.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById("fileInput").click();
    }

    function importJson(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          allRegions = JSON.parse(evt.target.result);
          renderRegions();
          alert(`Successfully imported ${allRegions.length} regions.`);
        } catch (err) {
          alert("Error parsing JSON: " + err);
        }
      };
      reader.readAsText(file);
    }

    window.onload = init;
  </script>
</body>
</html>
